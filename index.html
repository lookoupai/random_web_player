<!doctype html>
<html>
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>视频播放器</title>
    <script src="https://s0.pstatp.com/cdn/expire-1-M/hls.js/0.10.1/hls.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.webstatic.cn/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .player-container {
            width: 100%;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-title {
            position: fixed;
            left: 20px;
            bottom: 60px;
            color: white;
            font-size: 16px;
            z-index: 999;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 8px;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        /* 仅在非移动端使用hover效果 */
        @media (hover: hover) {
            .player-container:hover .video-title,
            .player-container:hover .bottom-controls {
                opacity: 1;
            }
        }

        .player-container.controls-visible .video-title,
        .player-container.controls-visible .bottom-controls {
            opacity: 1;
        }

        .controls {
            position: fixed;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 999;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 10px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .control-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }

        .control-button:active {
            transform: scale(0.9);
        }

        .control-button i {
            font-size: 24px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .control-button span {
            font-size: 12px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        /* 仅在非移动端使用hover效果 */
        @media (hover: hover) and (pointer: fine) {
            .player-container:hover .video-title,
            .player-container:hover .bottom-controls {
                opacity: 1;
            }
        }

        .player-container.controls-visible .video-title,
        .player-container.controls-visible .bottom-controls {
            opacity: 1;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2.5px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #ff4081;
            border-radius: 2.5px;
            position: relative;
            width: 0;
        }

        .progress-handle {
            width: 12px;
            height: 12px;
            background: #ff4081;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .progress-handle:hover {
            transform: translateY(-50%) scale(1.2);
        }

        .time-display {
            color: white;
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        .play-pause-btn,
        .volume-control {
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .play-pause-btn:hover,
        .volume-control:hover {
            transform: scale(1.1);
        }

        .volume-slider {
            width: 80px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2.5px;
            cursor: pointer;
        }

        .volume-progress {
            height: 100%;
            background: #ff4081;
            border-radius: 2.5px;
            width: 100%;
        }

        .fullscreen-btn {
            color: white;
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.2s;
            margin-left: 10px;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .video-title {
                font-size: 14px;
                padding: 6px 12px;
                bottom: 70px;
                left: 15px;
                max-width: 70%;
            }

            .controls {
                right: max(15px, env(safe-area-inset-right, 15px));
                bottom: 100px;
                padding: 12px 8px;
            }

            .control-button i {
                font-size: 20px;
            }

            .control-button span {
                font-size: 10px;
            }

            .bottom-controls {
                bottom: 30px;
            }

            .next-button {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="video-title"></div>
        <video id="video" playsinline webkit-playsinline></video>
        <div class="controls">
            <div class="control-button" onclick="debounceNext()">
                <i class="fas fa-forward"></i>
                <span>下一个</span>
            </div>
        </div>
        <div class="bottom-controls">
            <div class="play-pause-btn">
                <i class="fas fa-play"></i>
            </div>
            <div class="progress-bar">
                <div class="progress">
                    <div class="progress-handle"></div>
                </div>
            </div>
            <div class="time-display">00:00 / 00:00</div>
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
            </div>
            <div class="volume-slider">
                <div class="volume-progress"></div>
            </div>
            <div class="fullscreen-btn">
                <i class="fas fa-expand"></i>
            </div>
        </div>
    </div>

    <script>
        // 初始化视频元素
        const video = document.getElementById('video');
        let hls = null;
        let touchStartTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        let videoHistory = [];
        let currentHistoryIndex = -1;
        let isAnimating = false;
        let lastVideoData = null;
        let lastTapTime = 0;
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        let controlsTimeout = null;
        
        // 初始化视频控制相关元素
        const playPauseBtn = document.querySelector('.play-pause-btn');
        const progressBar = document.querySelector('.progress-bar');
        const progress = document.querySelector('.progress');
        const progressHandle = document.querySelector('.progress-handle');
        const timeDisplay = document.querySelector('.time-display');
        const volumeControl = document.querySelector('.volume-control');
        const volumeSlider = document.querySelector('.volume-slider');
        const volumeProgress = document.querySelector('.volume-progress');
        const playerContainer = document.querySelector('.player-container');
        const bottomControls = document.querySelector('.bottom-controls');
        const fullscreenBtn = document.querySelector('.fullscreen-btn');

        // 防抖函数
        const debounce = (func, wait) => {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        };

        const debounceNext = debounce(() => {
            playNext();
        }, 300);

        // 视频控制功能
        function togglePlay() {
            if (!video) return;
            
            if (video.paused) {
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        if (isMobile) {
                            scheduleHideControls();
                        }
                    }).catch(error => {
                        console.log("播放失败:", error);
                    });
                }
            } else {
                video.pause();
                if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                showControls();
            }
        }

        function updateProgress() {
            if (!video.duration) return;
            const percent = (video.currentTime / video.duration) * 100;
            progress.style.width = `${percent}%`;
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }

        function seek(e) {
            const rect = progressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function startDragging(e) {
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDragging);
        }

        function drag(e) {
            const rect = progressBar.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            progress.style.width = `${pos * 100}%`;
            video.currentTime = pos * video.duration;
        }

        function stopDragging() {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDragging);
        }

        function changeVolume(e) {
            const rect = volumeSlider.getBoundingClientRect();
            let vol = (e.clientX - rect.left) / rect.width;
            vol = Math.max(0, Math.min(1, vol));
            video.volume = vol;
            volumeProgress.style.width = `${vol * 100}%`;
            updateVolumeIcon(vol);
        }

        function toggleMute() {
            video.muted = !video.muted;
            if (video.muted) {
                volumeProgress.style.width = '0';
                volumeControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else {
                volumeProgress.style.width = `${video.volume * 100}%`;
                updateVolumeIcon(video.volume);
            }
        }

        function updateVolumeIcon(volume) {
            if (volume >= 0.5) {
                volumeControl.innerHTML = '<i class="fas fa-volume-up"></i>';
            } else if (volume > 0) {
                volumeControl.innerHTML = '<i class="fas fa-volume-down"></i>';
            } else {
                volumeControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
            }
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "00:00";
            const minutes = Math.floor(seconds / 60);
            seconds = Math.floor(seconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 初始化事件监听
        function initializeEventListeners() {
            if (!video) return;

            // 移动端事件
            if (isMobile) {
                video.addEventListener('touchstart', handleTouchStart);
                video.addEventListener('touchmove', handleTouchMove);
                video.addEventListener('touchend', handleTouchEnd);
                
                // 移动端播放状态变化监听
                video.addEventListener('play', () => {
                    scheduleHideControls();
                });
                
                video.addEventListener('pause', () => {
                    clearTimeout(controlsTimeout);
                    showControls();
                });
            } else {
                // 桌面端事件
                video.addEventListener('click', (e) => {
                    e.preventDefault();
                    togglePlay();
                });

                // 桌面端鼠标移动控制
                if (playerContainer) {
                    playerContainer.addEventListener('mousemove', () => {
                        showControls();
                        if (!video.paused) {
                            scheduleHideControls(3000);
                        }
                    });

                    // 鼠标离开播放器时隐藏控制栏
                    playerContainer.addEventListener('mouseleave', () => {
                        if (!video.paused) {
                            hideControls();
                        }
                    });
                }
            }

            // 视频控制事件
            if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlay);
            if (progressBar) progressBar.addEventListener('click', seek);
            if (progressHandle) progressHandle.addEventListener('mousedown', startDragging);
            if (volumeSlider) volumeSlider.addEventListener('click', changeVolume);
            if (volumeControl) volumeControl.addEventListener('click', toggleMute);

            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('play', () => {
                if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                if (!isMobile) {
                    clearTimeout(controlsTimeout);
                    controlsTimeout = setTimeout(hideControls, 3000);
                }
            });
            video.addEventListener('pause', () => {
                if (playPauseBtn) playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                showControls();
            });

            // 空格键控制
            if (!isMobile) {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
                        e.preventDefault();
                        togglePlay();
                    }
                });
            }

            // 全屏按钮事件
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
                document.addEventListener('fullscreenchange', updateFullscreenButton);
                document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
            }
        }

        // 页面加载时初始化
        window.onload = async () => {
            initializeEventListeners();
            const videoData = await getVideoUrl();
            if (videoData) {
                lastVideoData = videoData;
                await playVideo(videoData, 'next');
            }
        };

        // 获取视频地址
        async function getVideoUrl() {
            try {
                const response = await fetch('http://146.56.106.71:8000/', {
                    method: 'GET',
                    mode: 'cors'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                if (result && result.status === 'success' && result.data && result.data.url && result.data.title) {
                    return result.data;
                }
                throw new Error('无法解析视频数据');
            } catch (error) {
                console.error('获取视频失败:', error);
                return null;
            }
        }

        // 检查URL是否可访问
        async function checkUrl(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                return true;
            } catch (error) {
                console.error('URL检查失败:', error);
                return false;
            }
        }

        // 播放视频
        async function playVideo(videoData = null, direction = 'next') {
            if (isAnimating) return;
            isAnimating = true;

            try {
                if (!videoData) {
                    videoData = await getVideoUrl();
                    if (!videoData) {
                        console.error('无法获取视频地址');
                        isAnimating = false;
                        setTimeout(() => playNext(), 1000);
                        return;
                    }
                }

                // 更新历史记录
                if (direction === 'next') {
                    if (lastVideoData) {
                        currentHistoryIndex++;
                        videoHistory.splice(currentHistoryIndex);
                        videoHistory.push(lastVideoData);
                    }
                    lastVideoData = videoData;
                }

                // 更新视频标题
                const titleElement = document.querySelector('.video-title');
                if (titleElement) {
                    titleElement.textContent = videoData.title;
                }

                // 销毁旧的HLS实例
                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                // 重置视频元素
                video.src = '';
                video.load();

                let playStarted = false;
                let errorOccurred = false;

                // 设置超时检查
                const timeout = setTimeout(() => {
                    if (!playStarted && !errorOccurred) {
                        console.log('播放超时，切换下一个视频');
                        errorOccurred = true;
                        isAnimating = false;
                        playNext();
                    }
                }, 10000);

                // 根据视频类型播放
                if (videoData.url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hls = new Hls({
                            debug: false,
                            enableWorker: false,
                            manifestLoadingTimeOut: 10000,
                            manifestLoadingMaxRetry: 2,
                            levelLoadingTimeOut: 10000,
                            levelLoadingMaxRetry: 2,
                            xhrSetup: function(xhr, url) {
                                xhr.withCredentials = false;
                            }
                        });

                        let hlsError = false;
                        
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            console.log('HLS错误类型:', data.type);
                            console.log('HLS错误详情:', data.details);
                            
                            if (!errorOccurred && (data.fatal || data.type === 'networkError')) {
                                console.error('严重HLS错误，切换下一个视频');
                                errorOccurred = true;
                                hlsError = true;
                                if (hls) {
                                    hls.destroy();
                                    hls = null;
                                }
                                clearTimeout(timeout);
                                isAnimating = false;
                                setTimeout(() => playNext(), 1000);
                            }
                        });

                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            if (!errorOccurred) {
                                playStarted = true;
                                clearTimeout(timeout);
                                video.muted = true;
                                video.play().then(() => {
                                    setTimeout(() => {
                                        if (!errorOccurred) {
                                            video.muted = false;
                                            if (isMobile) {
                                                clearTimeout(controlsTimeout);
                                                controlsTimeout = setTimeout(hideControls, 1000);
                                            }
                                        }
                                    }, 500);
                                }).catch(e => {
                                    if (!errorOccurred) {
                                        console.error('播放失败:', e);
                                        errorOccurred = true;
                                        isAnimating = false;
                                        setTimeout(() => playNext(), 1000);
                                    }
                                });
                            }
                        });

                        if (!errorOccurred) {
                            try {
                                hls.loadSource(videoData.url);
                                hls.attachMedia(video);
                            } catch (error) {
                                console.error('HLS加载失败:', error);
                                errorOccurred = true;
                                isAnimating = false;
                                setTimeout(() => playNext(), 1000);
                            }
                        }
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = videoData.url;
                        video.addEventListener('loadedmetadata', function() {
                            if (!errorOccurred) {
                                playStarted = true;
                                clearTimeout(timeout);
                                video.muted = true;
                                video.play().then(() => {
                                    setTimeout(() => {
                                        if (!errorOccurred) {
                                            video.muted = false;
                                            if (isMobile) {
                                                clearTimeout(controlsTimeout);
                                                controlsTimeout = setTimeout(hideControls, 1000);
                                            }
                                        }
                                    }, 500);
                                }).catch(e => {
                                    if (!errorOccurred) {
                                        console.error('播放失败:', e);
                                        errorOccurred = true;
                                        isAnimating = false;
                                        setTimeout(() => playNext(), 1000);
                                    }
                                });
                            }
                        });

                        video.addEventListener('error', function() {
                            if (!errorOccurred) {
                                console.error('视频加载错误');
                                errorOccurred = true;
                                clearTimeout(timeout);
                                isAnimating = false;
                                setTimeout(() => playNext(), 1000);
                            }
                        });
                    } else {
                        console.error('浏览器不支持HLS播放');
                        errorOccurred = true;
                        clearTimeout(timeout);
                        isAnimating = false;
                        setTimeout(() => playNext(), 1000);
                        return;
                    }
                } else {
                    video.src = videoData.url;
                    video.addEventListener('loadedmetadata', function() {
                        if (!errorOccurred) {
                            playStarted = true;
                            clearTimeout(timeout);
                            video.muted = true;
                            video.play().then(() => {
                                setTimeout(() => {
                                    if (!errorOccurred) {
                                        video.muted = false;
                                        if (isMobile) {
                                            clearTimeout(controlsTimeout);
                                            controlsTimeout = setTimeout(hideControls, 1000);
                                        }
                                    }
                                }, 500);
                            }).catch(e => {
                                if (!errorOccurred) {
                                    console.error('播放失败:', e);
                                    errorOccurred = true;
                                    isAnimating = false;
                                    setTimeout(() => playNext(), 1000);
                                }
                            });
                        }
                    });

                    video.addEventListener('error', function() {
                        if (!errorOccurred) {
                            console.error('视频加载错误');
                            errorOccurred = true;
                            clearTimeout(timeout);
                            isAnimating = false;
                            setTimeout(() => playNext(), 1000);
                        }
                    });
                }

                if (!errorOccurred) {
                    isAnimating = false;
                }

            } catch (error) {
                console.error('播放视频失败:', error);
                isAnimating = false;
                setTimeout(() => playNext(), 1000);
            }
        }

        // 播放下一个视频
        async function playNext() {
            await playVideo(null, 'next');
        }

        // 添加播放状态指示
        if (video) {
            video.addEventListener('play', () => {
                if (playerContainer) {
                    playerContainer.style.cursor = isMobile ? 'default' : 'default';
                }
            });

            video.addEventListener('pause', () => {
                if (playerContainer) {
                    playerContainer.style.cursor = isMobile ? 'default' : 'pointer';
                }
            });
        }

        function handleTouchStart(e) {
            touchStartTime = Date.now();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            if (isAnimating) return;
            const touchMoveY = e.touches[0].clientY;
            const touchMoveX = e.touches[0].clientX;
            const deltaY = touchMoveY - touchStartY;
            const deltaX = touchMoveX - touchStartX;

            // 如果移动距离超过阈值，标记为已移动
            if (Math.abs(deltaY) > 10 || Math.abs(deltaX) > 10) {
                touchMoved = true;
            }

            if (Math.abs(deltaY) > 30) {
                e.preventDefault();
            }
        }

        function handleTouchEnd(e) {
            const touchEndTime = Date.now();
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const touchDuration = touchEndTime - touchStartTime;
            const deltaY = touchEndY - touchStartY;
            const deltaX = touchEndX - touchStartX;

            // 如果是滑动操作
            if (touchMoved) {
                if (Math.abs(deltaY) > 50 && Math.abs(deltaY) > Math.abs(deltaX)) {
                    if (deltaY > 0 && currentHistoryIndex > 0) {
                        currentHistoryIndex--;
                        playVideo(videoHistory[currentHistoryIndex], 'prev');
                    } else if (deltaY < 0) {
                        playNext();
                    }
                }
            } else {
                // 如果是点击操作（没有移动或移动很小）
                if (touchDuration < 300) {
                    if (touchEndTime - lastTapTime < 300) {
                        // 双击
                        addHeart(touchEndX, touchEndY);
                        lastTapTime = 0;
                    } else {
                        // 单击
                        lastTapTime = touchEndTime;
                        showControls();
                        togglePlay();
                        if (!video.paused) {
                            scheduleHideControls();
                        }
                    }
                }
            }
        }

        function addHeart(x, y) {
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart heart-animation';
            heart.style.left = `${x - 50}px`;
            heart.style.top = `${y - 50}px`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerContainer.requestFullscreen) {
                    playerContainer.requestFullscreen();
                } else if (playerContainer.webkitRequestFullscreen) {
                    playerContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // 更新全屏按钮图标
        function updateFullscreenButton() {
            if (!fullscreenBtn) return;
            
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        }

        function showControls() {
            if (playerContainer) {
                clearTimeout(controlsTimeout);
                playerContainer.classList.add('controls-visible');
            }
        }

        function hideControls() {
            if (playerContainer && !video.paused) {
                clearTimeout(controlsTimeout);
                playerContainer.classList.remove('controls-visible');
            }
        }

        // 统一管理控制栏隐藏的定时器
        function scheduleHideControls(delay = 1000) {
            clearTimeout(controlsTimeout);
            if (!video.paused) {
                controlsTimeout = setTimeout(hideControls, delay);
            }
        }
    </script>
</body>
</html>
